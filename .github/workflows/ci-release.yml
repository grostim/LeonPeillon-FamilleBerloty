name: Validation LaTeX et formats de lecture

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-lang-french texlive-fonts-recommended lmodern cm-super
      - name: Construire les trois formats
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: leon-peillon-documents
          if-no-files-found: error
          path: |
            output/pdf/Leon_Peillon_Famille_Berloty.pdf
            output/Leon_Peillon_Famille_Berloty.epub
            output/Leon_Peillon_Famille_Berloty.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leon-peillon-documents
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/pdf/Leon_Peillon_Famille_Berloty.pdf
            dist/Leon_Peillon_Famille_Berloty.epub
            dist/Leon_Peillon_Famille_Berloty.md
